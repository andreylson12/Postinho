<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#124e3c">
  <meta name="description" content="Vendas de gasolina, fechamento automático e fiados no Postinho Fácil.">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <title>Postinho Fácil</title>
  <style nonce="__CSP_NONCE__">
    :root{font-family:Arial,Helvetica,sans-serif;color:#193b2a;background:#f5f8f5;color-scheme:light}
    *{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.47;cursor:not-allowed}
    h1,h2,h3,p{margin-top:0}h1{font-size:clamp(28px,5vw,40px);letter-spacing:-1.5px;margin-bottom:9px}h2{font-size:19px}
    .topbar{background:#124e3c;color:#fff;box-shadow:0 3px 15px #124e3c22}.top-inner{max-width:1100px;margin:auto;padding:15px 20px;display:flex;align-items:center;gap:12px}
    .mark{width:49px;height:49px;background:#f4bd5e;color:#124e3c;border-radius:14px;display:grid;place-items:center;font-size:25px}
    .brand{display:flex;flex-direction:column;min-width:0;gap:3px}.brand strong{font-size:20px}.brand span{font-size:12px;color:#c5e1d3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .status{margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:#d6efe1}.dot{height:8px;width:8px;background:#6be29c;border-radius:10px;display:inline-block}.dot.off{background:#ff9b81}
    .container{width:min(1070px,calc(100% - 28px));margin:22px auto 45px}.nav{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;margin:0 0 18px;border-bottom:1px solid #dbe5df}
    .nav button,.small-btn{border:1px solid #d4e2d9;background:white;border-radius:11px;color:#245841;font-weight:700;padding:11px 13px;white-space:nowrap}
    .nav button.active{background:#dff2e7;border-color:#90c9a7;color:#126a40}.nav .push{margin-left:auto}
    .intro{text-align:left;margin:15px 2px 19px}.intro p,.muted{color:#6b8173;font-size:14px;line-height:1.5}.eyebrow{font-size:10px;letter-spacing:1.4px;font-weight:900;color:#167c51}
    .cashier{max-width:660px;margin:auto}.card{background:#fff;border:1px solid #dfebe3;border-radius:19px;box-shadow:0 7px 23px #235a3812;padding:22px;margin-bottom:18px}
    .fuel-head{display:flex;align-items:center;gap:12px;border-bottom:1px solid #edf2ee;padding-bottom:19px}.fuel-head .fuel-icon{font-size:24px;background:#f1f7f2;border-radius:13px;padding:10px}
    .fuel-head strong{font-size:20px}.fuel-head small{display:block;color:#718579;margin-top:3px}.pill{margin-left:auto;background:#dff3e8;color:#1b774b;font-size:10px;padding:8px;border-radius:99px;font-weight:900}
    .step{font-size:16px;font-weight:900;margin:24px 0 14px;display:flex;gap:9px;align-items:center}.step span{display:inline-grid;place-items:center;background:#237c54;color:#fff;border-radius:50%;width:27px;height:27px;font-size:13px}
    .liter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.liter-btn{min-height:76px;border:2px solid #e5ede7;border-radius:13px;background:#f8faf8;color:#244936;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:5px}
    .liter-btn strong{font-size:27px}.liter-btn small{font-size:11px;color:#789182}.liter-btn.active,.pay-btn.active{border-color:#248454;background:#e1f3e7;color:#12643e}
    .calculator{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#f1f8f2;border-radius:13px;padding:16px;margin-top:19px}
    label{font-size:13px;font-weight:700;color:#496752;display:block}.calculator input{width:110px;font-size:24px;font-weight:800;padding:9px;border-radius:9px;border:1px solid #cfe0d3;color:#1b6846;max-width:100%;margin-top:7px}
    .total{text-align:right;display:flex;flex-direction:column;gap:5px}.total small{color:#5c7563}.total strong{font-size:clamp(23px,5vw,32px);color:#177748;white-space:nowrap}
    .link-btn{border:none;background:transparent;padding:10px 0;text-decoration:underline;color:#56806b;font-size:12px}
    .pay-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.pay-btn{min-height:78px;border:2px solid #e5ece7;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:6px;color:#3d5747;font-weight:800;font-size:12px}.pay-btn span{font-size:24px}
    .field{display:block;margin:16px 0 0}.field input,.field select,.field textarea{display:block;width:100%;margin-top:8px;border:1px solid #d2e0d7;padding:12px;border-radius:10px;min-height:44px;background:#fff;color:#173b2a;font-size:16px}
    .checkline{display:flex;align-items:flex-start;gap:11px;background:#eaf6ed;padding:13px;border:1px solid #cde7d3;border-radius:12px;margin-top:18px;font-size:13px;color:#286246;line-height:1.5}.checkline input{width:22px;height:22px;flex:none;margin:0;accent-color:#198150}
    .warning{background:#fff8e7;border:1px solid #eedda9;border-radius:12px;padding:14px;color:#815b1e;font-size:13px;line-height:1.45;margin-top:15px}.warning strong{display:block;margin-bottom:3px}
    .success{background:#e6f6eb;border:1px solid #b8e1c4;border-radius:13px;padding:16px;color:#185f3b;margin:18px 0}.success strong{font-size:18px}.success p{font-size:13px;margin:8px 0 0}
    .main-btn{border:0;border-radius:12px;background:#188150;color:white;font-size:18px;font-weight:900;padding:17px;width:100%;margin-top:18px;box-shadow:0 5px 12px #18815022}.main-btn.secondary{background:#225d47}.main-btn.danger{background:#b95037}
    .micro{font-size:11px;color:#758c7c;text-align:center;margin:11px 0 0;line-height:1.5}.day-box{background:#e6f5eb;border:1px solid #cbe6d4;padding:17px 20px;border-radius:16px;display:flex;justify-content:space-between;align-items:center;margin-top:17px}.day-box small{display:block;color:#51795d}.day-box strong{font-size:26px;color:#195f3c}
    .row{display:flex;justify-content:space-between;gap:12px;align-items:center}.row small{color:#718577}.entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #ecf0ed}.entry:last-child{border-bottom:0}.entry strong{font-size:15px}.entry small{display:block;font-size:12px;color:#789080;margin-top:5px}.entry .right{text-align:right}
    .overview{max-width:1070px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:15px 0 18px}.stat{background:#fff;border:1px solid #dfe9e2;border-radius:15px;padding:17px;display:flex;flex-direction:column;gap:9px}.stat strong{font-size:24px;letter-spacing:-.6px;color:#21563b}.stat small{color:#698271}.stat.hot{background:#e3f3e8;border-color:#b6e1c2}
    .cols{display:grid;grid-template-columns:1fr 1fr;gap:15px}.line{display:flex;justify-content:space-between;gap:10px;padding:11px 0;border-bottom:1px solid #edf1ed}.line:last-child{border-bottom:0}.line strong{color:#1b5335}.line.total-line{font-weight:900;border-top:1px solid #b9d5c4;margin-top:7px}
    .section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:15px}.section-head h2{margin:0}.section-head small{color:#819385}
    .form-row{display:flex;align-items:end;gap:9px;flex-wrap:wrap}.form-row .field{margin:0;flex:1;min-width:160px}.form-row button{min-height:44px}
    .notice{border-radius:12px;padding:13px 16px;font-size:13px;line-height:1.5;margin-bottom:15px}.notice.error{background:#fff0ed;color:#873922;border:1px solid #edc1b4}.notice.ok{background:#e7f5e8;color:#1a7348;border:1px solid #bddfc7}
    .empty{text-align:center;color:#8c9a8e;padding:25px 4px}.date-input{border:1px solid #d2e0d6;padding:9px;border-radius:10px;background:white;margin:0 0 14px;max-width:230px}
    .modal{position:fixed;inset:0;background:#0d2c208a;display:grid;place-items:center;padding:16px;z-index:20}.modal.hidden,.hidden{display:none!important}.modal-card{width:min(410px,100%);background:white;border-radius:20px;padding:24px;box-shadow:0 12px 50px #002a1a55}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.modal-head h2{margin:0}.quiet{border:0;background:none;color:#577a61;font-size:20px}
    .sticky-ticket{border-color:#92c9a8;box-shadow:0 5px 20px #1b8a5123}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);max-width:calc(100% - 30px);width:520px;z-index:25;background:#164c37;color:white;border-radius:13px;padding:13px 17px;box-shadow:0 6px 25px #0c362a55;font-size:14px}
    .foot{text-align:center;color:#93a49a;font-size:11px;margin:35px 0}.badge{font-size:10px;padding:4px 7px;background:#edf3ef;border-radius:7px;color:#52715d;display:inline-block;margin-right:5px}.badge.debt{background:#fff3d6;color:#8e6614}.badge.paid{background:#e4f5e9;color:#247349}
    @media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.cols{grid-template-columns:1fr}.card{padding:17px}.status{font-size:0}.brand strong{font-size:18px}}
    @media(max-width:430px){.liter-grid,.pay-grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.liter-btn{min-height:68px}.liter-btn strong{font-size:22px}.pay-btn{font-size:10px;min-height:71px}.total strong{font-size:22px}.calculator{padding:13px}.stats{gap:7px}.stat{padding:12px}.stat strong{font-size:20px}.pill{display:none}}
  </style>
</head>
<body>
  <header class="topbar"><div class="top-inner"><div class="mark" aria-hidden="true">⛽</div><div class="brand"><strong>Postinho Fácil</strong><span id="businessTop">Conectando ao banco…</span></div><div class="status"><i id="onlineDot" class="dot"></i><span id="onlineText">Online</span></div></div></header>
  <main class="container"><nav id="nav" class="nav" aria-label="Navegação"></nav><div id="notice" aria-live="polite"></div><div id="main"></div><footer class="foot">🔒 Postinho Fácil · Dados compartilhados no PostgreSQL do Railway</footer></main>
  <div class="modal hidden" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginHeading"><div class="modal-card"><div class="modal-head"><h2 id="loginHeading">🔐 Área protegida</h2><button class="quiet" data-action="close-login" aria-label="Fechar">✕</button></div><p class="muted">Digite a senha do administrador para ver fechamento, fiados e ajustes.</p><form id="loginForm"><label class="field">Senha de administrador<input id="adminPassword" type="password" autocomplete="current-password" minlength="12" required></label><button class="main-btn" type="submit">Entrar na administração</button></form><p class="micro">A senha fica somente no servidor Railway. Não a coloque no GitHub.</p></div></div>
  <script nonce="__CSP_NONCE__">
  (() => {
    'use strict';
    const byId = id => document.getElementById(id);
    const money = cents => (Number(cents||0)/100).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
    const liters = milli => (Number(milli||0)/1000).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:3});
    const brDate = d => d ? new Date(`${d}T12:00:00`).toLocaleDateString('pt-BR') : '';
    const time = t => t ? new Date(t).toLocaleTimeString('pt-BR',{timeZone:'America/Sao_Paulo',hour:'2-digit',minute:'2-digit'}) : '';
    const escapeHtml = t => String(t ?? '').replace(/[&<>"']/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
    const pays = {dinheiro:'💵 Dinheiro',pix:'◆ Pix',cartao:'💳 Cartão',fiado:'🤝 Fiado'};
    const dateNow = () => new Intl.DateTimeFormat('sv-SE',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
    const state = {role:'public',today:dateNow(),settings:{businessName:'Meu Postinho',sellPriceCents:0},sales:[],tab:'venda',qty:'0',payment:'',customer:'',checked:false,pending:null,lastSale:null,loading:true,reportDate:dateNow(),report:null,credits:null,receiveOpen:'',busy:false,notice:''};
    const pendingKey = 'postinho_pendente_railway_v1';
    try { const pending = JSON.parse(localStorage.getItem(pendingKey)||'null'); if (pending?.id) state.pending=pending; } catch { /* não bloquear */ }

    async function api(path,method='GET',data) {
      const res = await fetch(path,{method,credentials:'same-origin',cache:'no-store',headers:method==='GET'?{}:{'Content-Type':'application/json','X-Postinho-Request':'1'},body:data===undefined?undefined:JSON.stringify(data)});
      const obj = await res.json().catch(()=>({}));
      if (!res.ok) throw new Error(obj.error||'Sem conexão com o servidor.');
      return obj;
    }
    let noticeTimer;
    function flash(msg,bad=false) { state.notice=msg; const el=byId('notice');el.innerHTML=`<div class="notice ${bad?'error':'ok'}">${escapeHtml(msg)}</div>`;clearTimeout(noticeTimer);noticeTimer=setTimeout(()=>{state.notice='';el.innerHTML='';},6000); }
    const eligible = () => state.role==='admin'||state.role==='device';
    const milli = () => Math.round(Number(String(state.qty).replace(',','.'))*1000);
    const validQty = () => Number.isSafeInteger(milli())&&milli()>=1&&milli()<=500000;
    const total = () => validQty()?Math.round(milli()*state.settings.sellPriceCents/1000):0;
    const isAdmin = () => state.role==='admin';

    function nav() {
      const tabs = [['venda','⛽ Vender']];
      if (isAdmin()) tabs.push(['fechamento','📊 Fechamento'],['fiados','🤝 Fiados'],['ajustes','⚙️ Ajustes']);
      byId('nav').innerHTML=tabs.map(([key,label])=>`<button class="${state.tab===key?'active':''}" data-nav="${key}">${label}</button>`).join('')+
        (isAdmin()?'<button class="push small-btn" data-action="logout">Sair da administração</button>':`<button class="push small-btn" data-action="login">🔐 Área protegida</button>`);
    }
    function recent(s) { return `<div class="entry"><div><strong>${liters(s.litersMilli)} L</strong><small>${time(s.createdAt)} · ${pays[s.payment]||''}${s.customer?' · '+escapeHtml(s.customer):''}</small></div><div class="right"><strong>${money(s.totalCents)}</strong><small>${s.voidedAt?'Anulada':s.dispensedAt?'Abastecido':'Aguardando combustível'}</small>${!s.voidedAt&&!s.dispensedAt?`<button class="small-btn" data-dispense="${escapeHtml(s.id)}">Concluir</button>`:''}</div></div>`; }
    function saleView() {
      const price=state.settings.sellPriceCents;
      const rendered=state.pending;
      const recentSales=state.sales.filter(s=>!s.voidedAt);
      const received=recentSales.reduce((n,s)=>n+s.totalCents,0);
      return `<section class="cashier"><div class="intro"><span class="eyebrow">${eligible()?'VENDA RÁPIDA':'CONSULTA DE ABASTECIMENTO'}</span><h1>Vender gasolina ⛽</h1>
        <p>${eligible()?'Escolha os litros, confira o pagamento e registre. Depois marque o abastecimento.':'Consulte os litros e os valores. Para registrar vendas, o tablet precisa ser autorizado.'}</p></div>
        ${!price?'<div class="warning">⚠️ O preço da gasolina ainda não foi configurado. Entre em Ajustes como administrador.</div>':''}
        <div class="card"><div class="fuel-head"><div class="fuel-icon">⛽</div><div><strong>Gasolina</strong><small>${money(price)} por litro</small></div><span class="pill">VENDA NOVA</span></div>
          <div class="step"><span>1</span> Quantos litros?</div><div class="liter-grid">${[1,2,3,5,10,20,50].map(v=>`<button class="liter-btn ${milli()===v*1000?'active':''}" data-liters="${v}" ${rendered?'disabled':''}><strong>${v}</strong><small>litro${v!==1?'s':''}</small></button>`).join('')}</div>
          <div class="calculator"><label>Litros desta venda<input id="qty" type="number" inputmode="decimal" min="0.001" max="500" step="0.001" value="${escapeHtml(state.qty)}" ${rendered?'disabled':''}> L</label><div class="total"><small>Valor da venda</small><strong id="saleTotal">${money(total())}</strong></div></div>
          <button class="link-btn" data-action="clear" ${rendered?'disabled':''}>Limpar litros</button>
          ${eligible()?`<div class="step"><span>2</span> Como recebeu?</div><div class="pay-grid">${Object.entries(pays).map(([key,label])=>`<button class="pay-btn ${state.payment===key?'active':''}" data-pay="${key}" ${rendered?'disabled':''}><span>${label.split(' ')[0]}</span>${label.split(' ').slice(1).join(' ')}</button>`).join('')}</div>
          ${state.payment==='fiado'?`<label class="field">Nome do cliente fiado<input id="customer" type="text" maxlength="80" required placeholder="Ex.: José" value="${escapeHtml(state.customer)}" ${rendered?'disabled':''}></label>`:state.payment?`<label class="checkline"><input type="checkbox" id="receivedCheck" ${state.checked?'checked':''} ${rendered?'disabled':''}><span>Eu conferi e recebi o pagamento em ${escapeHtml(pays[state.payment]||'')} antes do abastecimento.</span></label>`:''}
          <div class="warning"><strong>Pagamento manual nesta versão</strong>A Point Smart 2 ainda não está integrada. No Pix ou cartão, confira o pagamento na maquininha/conta. Este sistema não faz cobrança automática.</div>
          ${rendered?`<button class="main-btn secondary" data-action="retry" ${state.busy?'disabled':''}>↻ Reenviar a mesma venda pendente</button>`:`<button class="main-btn" data-action="register" ${state.busy||!validQty()||!price||!state.payment||(state.payment==='fiado'?!state.customer.trim():!state.checked)?'disabled':''}>${state.payment==='fiado'?'🤝 REGISTRAR FIADO':'✓ REGISTRAR PAGAMENTO'}</button>`}`:
          '<div class="warning"><strong>🔒 Registro bloqueado neste navegador</strong>A tela pode ser consultada, mas só um tablet autorizado consegue registrar vendas.</div>'}
          <p class="micro">Os dados são salvos online. Se houver falha, reenvie a mesma venda para não duplicar.</p></div>
        ${state.lastSale?`<div class="card sticky-ticket"><h2>✅ Venda registrada</h2><p><strong>${liters(state.lastSale.litersMilli)} L · ${money(state.lastSale.totalCents)}</strong></p><p class="muted">${state.lastSale.payment==='fiado'?'Fiado registrado, ainda não recebido.':'Pagamento informado pelo operador, sem confirmação automática do Mercado Pago.'}</p>
          ${state.lastSale.dispensedAt?'<div class="success">⛽ Abastecimento concluído!</div>':`<button class="main-btn" data-dispense="${escapeHtml(state.lastSale.id)}">⛽ MARCAR ABASTECIMENTO CONCLUÍDO</button>`}</div>`:''}
        ${eligible()?`<div class="day-box"><div><small>Vendas de hoje</small><strong>${money(received)}</strong><small>${recentSales.length} venda(s) · ${liters(recentSales.reduce((n,s)=>n+s.litersMilli,0))} L</small></div><span style="font-size:28px">📊</span></div>
          <div class="card"><div class="section-head"><h2>Últimas vendas</h2><button class="small-btn" data-action="refresh">Atualizar</button></div>${state.sales.length?state.sales.slice(0,12).map(recent).join(''):'<p class="empty">Nenhuma venda hoje.</p>'}</div>`:''}
      </section>`;
    }
    const sum = values => values.reduce((n,v)=>n+v,0);
    const stat = (name,value,small,hot=false) => `<div class="stat ${hot?'hot':''}"><small>${name}</small><strong>${value}</strong><small>${small}</small></div>`;
    function reportView() {
      const r=state.report; if(!r)return '<p class="empty">Carregando fechamento…</p>';
      const ss=r.sales.filter(s=>!s.voidedAt);
      const salesAmount=sum(ss.map(s=>s.totalCents));const amountCost=sum(ss.map(s=>Math.round(s.litersMilli*s.costCents/1000)));
      const expenses=sum(r.expenses.map(e=>e.amountCents));const received=sum(ss.filter(s=>s.payment!=='fiado').map(s=>s.totalCents))+sum(r.receipts.map(x=>x.amountCents));
      const paymentSummary=Object.entries(pays).map(([method,label])=>`<div class="line"><span>${label}</span><strong>${money(sum(ss.filter(s=>s.payment===method).map(s=>s.totalCents)))}</strong></div>`).join('');
      return `<div class="overview"><div class="intro"><span class="eyebrow">ACOMPANHAMENTO ONLINE</span><h1>Fechamento automático</h1><p>Veja vendas, litros e resultado do dia. Fiados só entram em dinheiro recebido quando forem pagos.</p></div>
        <label>Movimento do dia <input id="reportDate" class="date-input" type="date" value="${escapeHtml(state.reportDate)}"></label>
        <div class="stats">${stat('Total vendido',money(salesAmount),`${ss.length} abastecimento(s)`,true)}${stat('Litros vendidos',`${liters(sum(ss.map(s=>s.litersMilli)))} L`,'Somente gasolina')}${stat('Recebido',money(received),'Pagos + fiados recebidos')}${stat('Lucro estimado',money(salesAmount-amountCost-expenses),'Após custo e despesas')}</div>
        <div class="cols"><section class="card"><h2>Por forma de pagamento</h2>${paymentSummary}<div class="line total-line"><span>Total vendido</span><strong>${money(salesAmount)}</strong></div></section>
        <section class="card"><h2>Resultado do dia</h2><div class="line"><span>Vendas</span><strong>${money(salesAmount)}</strong></div><div class="line"><span>Custo da gasolina</span><strong>− ${money(amountCost)}</strong></div><div class="line"><span>Despesas</span><strong>− ${money(expenses)}</strong></div><div class="line total-line"><span>Lucro estimado</span><strong>${money(salesAmount-amountCost-expenses)}</strong></div><p class="micro">Não inclui taxas de cartão, impostos e custos não registrados. Vendas fiadas contam como faturamento.</p></section></div>
        <section class="card"><div class="section-head"><h2>Vendas do dia</h2><button class="small-btn" data-action="csv">↓ Exportar CSV</button></div>${r.sales.length?r.sales.map(s=>`<div class="entry"><div><strong>${liters(s.litersMilli)} L · ${money(s.totalCents)}</strong><small>${time(s.createdAt)} · ${pays[s.payment]||''} ${s.customer?' · '+escapeHtml(s.customer):''}</small><small>${s.voidedAt?'❌ Anulada: '+escapeHtml(s.voidReason):s.dispensedAt?'⛽ Abastecida':'⏳ Aguardando abastecimento'}</small></div><div class="right">${!s.voidedAt?`<button class="small-btn" data-void="${escapeHtml(s.id)}">Anular</button>`:''}</div></div>`).join(''):'<p class="empty">Nenhuma venda nesse dia.</p>'}</section>
        <section class="card"><h2>Despesas do dia</h2><form id="expenseForm" class="form-row"><label class="field">Descrição<input name="description" placeholder="Energia, frete…" maxlength="100" required></label><label class="field">Valor (R$)<input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required></label><button class="small-btn" type="submit">Adicionar</button></form>${r.expenses.map(e=>`<div class="line"><span>${escapeHtml(e.description)}</span><strong>${money(e.amountCents)}</strong></div>`).join('')||'<p class="empty">Nenhuma despesa lançada.</p>'}</section>
      </div>`;
    }
    function creditsView() {
      if (!state.credits)return '<p class="empty">Carregando fiados…</p>';
      const items=state.credits.credits;
      return `<div class="overview"><div class="intro"><span class="eyebrow">CONTAS A RECEBER</span><h1>Clientes fiados</h1><p>Somente você, com a senha, consegue consultar e dar baixa.</p></div>
        <div class="stats">${stat('Total a receber',money(sum(items.map(c=>c.balanceCents))),'Saldos pendentes',true)}${stat('Fiados em aberto',String(items.length),'Clientes/vendas')}</div>
        <section class="card"><h2>Fiados pendentes</h2>${items.map(c=>`<div class="entry"><div><strong>${escapeHtml(c.customer)}</strong><small>${brDate(c.date)} · ${liters(c.litersMilli)} L</small><strong style="color:#a5791b">${money(c.balanceCents)}</strong></div><div class="right">${state.receiveOpen===c.id?`<form data-receive-form="${escapeHtml(c.id)}"><label class="field">Recebido (R$)<input name="amount" type="number" inputmode="decimal" min="0.01" max="${(c.balanceCents/100).toFixed(2)}" step="0.01" value="${(c.balanceCents/100).toFixed(2)}" required></label><label class="field">Forma<select name="payment"><option value="dinheiro">Dinheiro</option><option value="pix">Pix</option><option value="cartao">Cartão</option></select></label><button type="submit" class="small-btn">Confirmar recebimento</button></form>`:`<button class="small-btn" data-receive="${escapeHtml(c.id)}">Receber</button>`}</div></div>`).join('')||'<p class="empty">Tudo em dia! Nenhum fiado pendente.</p>'}</section></div>`;
    }
    function settingsView() { return `<div class="overview"><div class="intro"><span class="eyebrow">CONFIGURAÇÃO DO PROPRIETÁRIO</span><h1>Ajustes do postinho</h1><p>O custo da gasolina só aparece aqui. Na venda, o operador vê apenas o preço final.</p></div>
      <section class="card" style="max-width:650px"><h2>Preço da gasolina</h2><form id="settingsForm"><label class="field">Nome do postinho<input name="businessName" maxlength="70" value="${escapeHtml(state.settings.businessName)}" required></label><label class="field">Preço de venda por litro (R$)<input name="price" type="number" min="0.01" max="100" step="0.01" value="${(state.settings.sellPriceCents/100).toFixed(2)}" required></label><label class="field">Custo de compra por litro (R$)<input name="cost" type="number" min="0" max="100" step="0.01" value="${state.adminCost!==undefined?(state.adminCost/100).toFixed(2):''}" placeholder="Digite o custo" required></label><button class="main-btn" type="submit">Salvar ajustes</button></form><p class="micro">O custo fica registrado em cada venda e não altera o passado.</p></section>
      <section class="card" style="max-width:650px"><h2>🔐 Autorizar o tablet</h2><p class="muted">Faça login como administrador no tablet da sua mãe, toque no botão abaixo e depois saia da administração. A tela de venda continuará liberada neste aparelho.</p><button class="main-btn secondary" data-action="activate">✓ AUTORIZAR ESTE DISPOSITIVO</button><p class="muted" style="margin-top:16px">Perdeu o tablet? Revogue todos os dispositivos e autorize novamente apenas os seus.</p><button class="small-btn" data-action="revoke">Revogar todos os dispositivos autorizados</button></section>
      <section class="card" style="max-width:650px"><h2>Mercado Pago Point Smart 2</h2><div class="warning"><strong>Integração ainda pendente</strong>Este sistema não cobra cartão ou Pix sozinho. Para liberar combustível, confira antes o dinheiro ou a confirmação verdadeira da maquininha.</div></section>
    </div>`; }

    function render() {
      byId('businessTop').textContent=`${state.settings.businessName} · ${isAdmin()?'Administrador':state.role==='device'?'Caixa autorizado':'Consulta pública'}`;
      nav();
      const view=state.tab==='fechamento'&&isAdmin()?reportView():state.tab==='fiados'&&isAdmin()?creditsView():state.tab==='ajustes'&&isAdmin()?settingsView():saleView();
      byId('main').innerHTML=view;
      byId('onlineDot').classList.toggle('off',state.loading);
      byId('onlineText').textContent=state.loading?'Conectando':'Online';
    }
    async function boot({quiet=false}={}) {
      try { const data=await api('/api/bootstrap');state.role=data.role;state.settings=data.settings;state.today=data.today;state.sales=data.sales;state.loading=false;
        if (!isAdmin()&&state.tab!=='venda')state.tab='venda';
        if (isAdmin()&&state.tab==='ajustes') await loadCost();
        render();if(!quiet)flash('Dados atualizados.');
      } catch(e) { state.loading=true;byId('onlineDot').classList.add('off');byId('onlineText').textContent='Sem conexão';if(!quiet)flash(e.message,true); }
    }
    async function loadCost(){const data=await api('/api/admin/settings');state.adminCost=data.costPriceCents;}
    async function loadAdmin(){if(state.tab==='fechamento'){state.report=await api(`/api/admin/report?date=${encodeURIComponent(state.reportDate)}`);}if(state.tab==='fiados'){state.credits=await api('/api/admin/credits');}if(state.tab==='ajustes'){await loadCost();}render();}
    async function execute(callback) {if(state.busy)return;state.busy=true;try{await callback();}catch(e){flash(e.message,true);}finally{state.busy=false;render();}}
    async function register() {
      if(!eligible()||!validQty()||!state.payment||!state.settings.sellPriceCents)return;
      if(state.payment==='fiado'?!state.customer.trim():!state.checked){flash('Confirme o pagamento ou preencha o nome do fiado.',true);return;}
      state.pending={id:crypto.randomUUID(),litersMilli:milli(),payment:state.payment,customer:state.customer.trim(),paidConfirmed:state.payment==='fiado'?false:state.checked};
      localStorage.setItem(pendingKey,JSON.stringify(state.pending));
      await retry();
    }
    async function retry() {
      if(!state.pending)return;
      const result=await api('/api/sales','POST',state.pending);
      state.lastSale=result.sale;state.pending=null;localStorage.removeItem(pendingKey);
      state.qty='0';state.payment='';state.customer='';state.checked=false;
      flash('✅ Venda registrada online. Após abastecer, marque como concluída.');
      await boot({quiet:true});
    }
    async function dispense(id) {
      await api(`/api/sales/${id}/dispense`,'POST',{});
      if(state.lastSale?.id===id)state.lastSale.dispensedAt=new Date().toISOString();
      flash('Abastecimento concluído!');await boot({quiet:true});
    }
    function downloadCsv() {
      if(!state.report)return;const r=state.report;
      const protectCell=x=>'"'+String(x??'').replace(/^\s*([=+@-])/,(_,mark)=>"'"+mark).replace(/"/g,'""')+'"';
      const rows=[['Data','Hora','Litros','Valor R$','Pagamento','Cliente','Situação'],...r.sales.map(s=>[s.date,time(s.createdAt),(s.litersMilli/1000).toFixed(3).replace('.',','),(s.totalCents/100).toFixed(2).replace('.',','),pays[s.payment],s.customer,s.voidedAt?'Anulada':s.dispensedAt?'Abastecida':'Pendente'])];
      const blob=new Blob(['\uFEFF'+rows.map(row=>row.map(protectCell).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});
      const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`postinho-${state.reportDate}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(url),2000);
    }
    document.addEventListener('click',e=>{
      const navKey=e.target.closest('[data-nav]')?.dataset.nav;
      if(navKey){state.tab=navKey;state.receiveOpen='';if(isAdmin()&&navKey!=='venda')execute(loadAdmin);else render();return;}
      const lit=e.target.closest('[data-liters]')?.dataset.liters;if(lit){state.qty=lit;render();return;}
      const pay=e.target.closest('[data-pay]')?.dataset.pay;if(pay){state.payment=pay;state.checked=false;render();return;}
      const dispenseId=e.target.closest('[data-dispense]')?.dataset.dispense;if(dispenseId){execute(()=>dispense(dispenseId));return;}
      const recv=e.target.closest('[data-receive]')?.dataset.receive;if(recv){state.receiveOpen=recv;render();return;}
      const voidId=e.target.closest('[data-void]')?.dataset.void;if(voidId){const reason=prompt('Informe o motivo da anulação:');if(!reason?.trim())return;if(confirm('Confirma anular? A venda ficará no histórico.'))execute(async()=>{await api(`/api/admin/sales/${voidId}/void`,'POST',{reason:reason.trim()});flash('Venda anulada.');await loadAdmin();});return;}
      const action=e.target.closest('[data-action]')?.dataset.action;if(!action)return;
      switch(action){
        case 'login':byId('loginModal').classList.remove('hidden');byId('adminPassword').focus();break;
        case 'close-login':byId('loginModal').classList.add('hidden');byId('adminPassword').value='';break;
        case 'logout':execute(async()=>{await api('/api/auth/logout','POST',{});state.tab='venda';await boot({quiet:true});flash('Administração bloqueada.');});break;
        case 'activate':if(confirm('Autorizar ESTE aparelho a registrar vendas por até 180 dias?'))execute(async()=>{await api('/api/auth/activate-device','POST',{label:'Tablet do Postinho'});flash('Dispositivo autorizado! Agora saia da administração.');});break;
        case 'revoke':if(confirm('Isso bloqueará TODOS os tablets autorizados, incluindo este. Continuar?'))execute(async()=>{await api('/api/auth/revoke-devices','POST',{});flash('Todos os dispositivos foram revogados.');});break;
        case 'clear':state.qty='0';render();break;
        case 'register':execute(register);break;
        case 'retry':execute(retry);break;
        case 'refresh':execute(async()=>{await boot({quiet:true});flash('Atualizado.');});break;
        case 'csv':downloadCsv();break;
      }
    });
    document.addEventListener('input',e=>{
      if(e.target.id==='qty'){state.qty=e.target.value;const out=byId('saleTotal');if(out)out.textContent=money(total());/* Revalidar botão sem remover foco */const btn=document.querySelector('[data-action="register"]');if(btn)btn.disabled=!validQty()||!state.payment||!state.settings.sellPriceCents||(state.payment==='fiado'?!state.customer.trim():!state.checked);}
      if(e.target.id==='customer')state.customer=e.target.value;
      if(e.target.id==='receivedCheck')state.checked=e.target.checked;
      const btn=document.querySelector('[data-action="register"]');if(btn)btn.disabled=!validQty()||!state.payment||!state.settings.sellPriceCents||(state.payment==='fiado'?!state.customer.trim():!state.checked);
    });
    document.addEventListener('change',e=>{if(e.target.id==='reportDate'){state.reportDate=e.target.value;execute(loadAdmin);}});
    document.addEventListener('submit',e=>{
      if(e.target.id==='loginForm'){e.preventDefault();const pass=byId('adminPassword').value;execute(async()=>{await api('/api/auth/login','POST',{password:pass});byId('adminPassword').value='';byId('loginModal').classList.add('hidden');state.tab='fechamento';await boot({quiet:true});await loadAdmin();flash('Administração liberada.');});return;}
      if(e.target.id==='settingsForm'){e.preventDefault();const f=new FormData(e.target);const price=Math.round(Number(f.get('price'))*100),cost=Math.round(Number(f.get('cost'))*100);execute(async()=>{await api('/api/admin/settings','PUT',{businessName:String(f.get('businessName')).trim(),sellPriceCents:price,costPriceCents:cost});await boot({quiet:true});flash('Preço atualizado.');});return;}
      if(e.target.id==='expenseForm'){e.preventDefault();const f=new FormData(e.target);execute(async()=>{await api('/api/admin/expenses','POST',{id:crypto.randomUUID(),description:String(f.get('description')).trim(),amountCents:Math.round(Number(f.get('amount'))*100)});await loadAdmin();flash('Despesa registrada.');});return;}
      const id=e.target.dataset.receiveForm;if(id){e.preventDefault();const f=new FormData(e.target);execute(async()=>{await api(`/api/admin/credits/${id}/receipt`,'POST',{id:crypto.randomUUID(),amountCents:Math.round(Number(f.get('amount'))*100),payment:String(f.get('payment'))});state.receiveOpen='';await loadAdmin();flash('Recebimento lançado.');});}
    });
    boot({quiet:true});
    setInterval(()=>{if(!state.busy&&!state.pending&&state.tab==='venda')boot({quiet:true});},45000);
    if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
  })();
  </script>
</body>
</html>
